server:
  port: 8081
datasource:
  testhost: yToolsBox-db
  productionhost: yToolsBox-db
  port: 5432
  database: postgres
  dataleakge_database: 演示库
  username: postgres
  password: test123456
  charset: utf8

tool:
  scriptBasePath: Script
agentinstall:
  dscAgentInstallPath: /dsc-agent/
  dscAgentPackageName: hecate_agent-v2.0.0.175-20211228.rpm
  dasAgentInstallPath: /das-agent/
  dasAgentPackageName: agent_installer.bin

pocconfig:
  dscAgentConfigName: das_agent.ini
  dscAgentConfigPath: /etc/hecate_agent/
  restartDscAgentShell: hecate_agent.sh restart
  accountExtractContainerName: k8s_dsp-api-rich_dsp-api-rich
  accountExtractConfigPath: /dsc/data/meta-data/account/
  authConfigName: auth.conf
  appConfigName: app.conf
  dscDasContainerName: k8s_dsp-das_dsp-das

tcpreplayconfig:
  replaycontainername: yToolsBox-replay-custom
  pcappath: /pcap/
  multiaccountInner: InnerIPAll.pcap
  multiaccountForiegn: ForiegnIPAll.pcap

cleanerconfig:
  clickhousecontainername: k8s_clickhouse-server_clickhouse-server
  dbcontainername: k8s_postgres_postgres
  siemcontainername: k8s_dsp-siem_dsp-siem


